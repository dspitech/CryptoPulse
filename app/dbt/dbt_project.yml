name: cryptopulse
version: "1.1.0"
config-version: 2
profile: cryptopulse

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

vars:
  # Seuil du z-score au-dela duquel un rendement horaire est considere comme anormal
  anomaly_z_threshold: 3

models:
  cryptopulse:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts
    sentiment:
      +materialized: table
      +schema: marts
      +tags: ["sentiment"]
    forecast:
      +materialized: table
      +schema: marts
      +tags: ["forecast"]
