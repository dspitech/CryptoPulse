version: 2

models:
  - name: dim_coins
    description: "Referentiel des cryptomonnaies suivies."
    columns:
      - name: coin_id
        tests: [unique, not_null]

  - name: fct_latest_prices
    description: "Dernier snapshot connu par crypto."
    columns:
      - name: coin_id
        tests: [unique, not_null]
      - name: price_usd
        tests: [not_null]

  - name: fct_daily_prices
    description: "Prix OHLC journaliers par crypto, calcules depuis les snapshots horaires."
    columns:
      - name: daily_key
        tests: [unique, not_null]
      - name: coin_id
        tests: [not_null]
      - name: close_usd
        tests: [not_null]

  - name: fct_price_indicators
    description: "Moyennes mobiles 7 et 30 jours, variation journaliere et volatilite 7 jours. Les indicateurs restent nuls tant que la fenetre n'est pas complete."
    columns:
      - name: daily_key
        tests: [unique, not_null]

  - name: fct_price_anomalies
    description: "Rendements horaires avec z-score. is_anomaly vaut true quand le z-score depasse le seuil anomaly_z_threshold."
    columns:
      - name: anomaly_key
        tests: [unique, not_null]
      - name: direction
        tests:
          - accepted_values:
              values: ["hausse", "baisse", "stable"]

  - name: dim_data_freshness
    description: "Age du dernier snapshot par crypto."
    columns:
      - name: coin_id
        tests: [unique, not_null]
