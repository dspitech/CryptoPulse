global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["host.docker.internal:9100"]

  - job_name: cadvisor
    scrape_interval: 30s
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: airflow
    static_configs:
      - targets: ["statsd-exporter:9102"]

  - job_name: api
    static_configs:
      - targets: ["api:9000"]

  # Cibles Loki et Promtail : fichier genere par deploy.sh uniquement si la pile de logs est activee
  - job_name: logging
    file_sd_configs:
      - files: ["/etc/prometheus/targets/*.yml"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]

  - job_name: blackbox
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://airflow-webserver:8080/health
          - http://dashboard:8501/_stcore/health
          - http://grafana:3000/api/health
          - http://api:8000/health
          - https://api.coingecko.com/api/v3/ping
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
