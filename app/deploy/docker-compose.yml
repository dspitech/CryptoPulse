name: cryptopulse

x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__PARALLELISM: "4"
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
  AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://cryptopulse:${POSTGRES_PASSWORD}@postgres:5432/airflow
  AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
  AIRFLOW__WEBSERVER__WORKERS: "2"
  AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
  AIRFLOW__WEBSERVER__ENABLE_PROXY_FIX: ${AIRFLOW_PROXY_FIX:-False}
  AIRFLOW__SCHEDULER__PARSING_PROCESSES: "1"
  AIRFLOW__METRICS__STATSD_ON: "True"
  AIRFLOW__METRICS__STATSD_HOST: statsd-exporter
  AIRFLOW__METRICS__STATSD_PORT: "9125"
  AIRFLOW__METRICS__STATSD_PREFIX: airflow
  PYTHONPATH: /opt/airflow/app
  STORAGE_ACCOUNT: ${STORAGE_ACCOUNT}
  AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
  COINS: ${COINS}
  FRESHNESS_MAX_HOURS: ${FRESHNESS_MAX_HOURS}
  POSTGRES_HOST: postgres
  POSTGRES_DB: cryptopulse
  POSTGRES_USER: cryptopulse
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  NOTIFY_WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL:-}

x-airflow-volumes: &airflow-volumes
  - ../airflow/dags:/opt/airflow/dags
  - ../ingestion/cryptopulse_ingestion:/opt/airflow/app/cryptopulse_ingestion
  - ../dbt:/opt/airflow/dbt
  - /data/airflow-logs:/opt/airflow/logs

services:
  # ------------------------------------------------------------------ donnees
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: cryptopulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cryptopulse
      MONITORING_DB_PASSWORD: ${MONITORING_DB_PASSWORD}
      API_DB_PASSWORD: ${API_DB_PASSWORD}
    volumes:
      - /data/postgres:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
      - ./sql:/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cryptopulse -d cryptopulse"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ------------------------------------------------------------------ orchestration
  airflow-init:
    build:
      context: ../airflow
    image: cryptopulse-airflow:local
    environment:
      <<: *airflow-env
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
    volumes: *airflow-volumes
    depends_on:
      postgres:
        condition: service_healthy
      statsd-exporter:
        condition: service_started
    restart: "no"
    command:
      - bash
      - -c
      - |
        airflow db migrate &&
        airflow pools set dbt 1 "Executions dbt serialisees" &&
        airflow users create --username admin --password "$$AIRFLOW_ADMIN_PASSWORD" \
          --firstname Admin --lastname Admin --role Admin --email admin@example.com || true

  airflow-webserver:
    image: cryptopulse-airflow:local
    restart: unless-stopped
    command: webserver
    environment: *airflow-env
    volumes: *airflow-volumes
    ports:
      - "${PUBLIC_BIND:-0.0.0.0}:8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    image: cryptopulse-airflow:local
    restart: unless-stopped
    command: scheduler
    environment: *airflow-env
    volumes: *airflow-volumes
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ------------------------------------------------------------------ restitution
  dashboard:
    build:
      context: ../dashboard
    image: cryptopulse-dashboard:local
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: cryptopulse
      POSTGRES_USER: cryptopulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${PUBLIC_BIND:-0.0.0.0}:8501:8501"
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 256m

  api:
    build:
      context: ../api
    image: cryptopulse-api:local
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: cryptopulse
      POSTGRES_USER: api_ro
      POSTGRES_PASSWORD: ${API_DB_PASSWORD}
      API_KEY: ${API_KEY}
      API_METRICS_PORT: "9000"
    ports:
      - "${PUBLIC_BIND:-0.0.0.0}:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 192m

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    profiles: ["https"]
    environment:
      PUBLIC_FQDN: ${PUBLIC_FQDN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - /data/caddy:/data
    ports:
      - "80:80"
      - "443:443"
      - "8443:8443"
      - "9443:9443"
      - "8444:8444"
    mem_limit: 96m

  # ------------------------------------------------------------------ supervision
  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=3GB
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - /opt/cryptopulse/prometheus-targets:/etc/prometheus/targets:ro
      - /data/prometheus:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:9090:9090"
    mem_limit: 600m

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - /opt/cryptopulse/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - /data/alertmanager:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    mem_limit: 128m

  grafana:
    image: grafana/grafana-oss:11.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000/}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_DEFAULT_THEME: dark
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/cryptopulse-market.json
      MONITORING_DB_PASSWORD: ${MONITORING_DB_PASSWORD}
    volumes:
      - /data/grafana:/var/lib/grafana
      - ../monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ../monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "${PUBLIC_BIND:-0.0.0.0}:3000:3000"
    depends_on:
      - prometheus
    mem_limit: 400m

  loki:
    image: grafana/loki:3.1.1
    restart: unless-stopped
    profiles: ["logging"]
    command:
      - -config.file=/etc/loki/loki-config.yml
    volumes:
      - ../monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - /data/loki:/loki
    mem_limit: 300m

  promtail:
    image: grafana/promtail:3.1.1
    restart: unless-stopped
    profiles: ["logging"]
    command:
      - -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ../monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /data/promtail:/positions
    depends_on:
      - loki
    mem_limit: 96m

  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|var/lib/docker/.+)($$|/)
      - --collector.textfile.directory=/host/var/lib/node_exporter/textfile
    volumes:
      - /:/host:ro,rslave
    mem_limit: 64m

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    devices:
      - /dev/kmsg:/dev/kmsg
    command:
      - --housekeeping_interval=30s
      - --docker_only=true
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.service
      - --disable_metrics=percpu,sched,tcp,udp,advtcp,hugetlb,referenced_memory,cpu_topology,resctrl,process,memory_numa,perf_event
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    mem_limit: 256m

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://monitoring_ro:${MONITORING_DB_PASSWORD}@postgres:5432/cryptopulse?sslmode=disable
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/postgres-exporter/queries.yaml
    volumes:
      - ../monitoring/postgres-exporter/queries.yaml:/etc/postgres-exporter/queries.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 64m

  statsd-exporter:
    image: prom/statsd-exporter:v0.26.1
    restart: unless-stopped
    command:
      - --statsd.mapping-config=/etc/statsd/statsd-mapping.yml
      - --statsd.listen-udp=:9125
      - --web.listen-address=:9102
    volumes:
      - ../monitoring/statsd/statsd-mapping.yml:/etc/statsd/statsd-mapping.yml:ro
    mem_limit: 64m

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ../monitoring/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    mem_limit: 64m
