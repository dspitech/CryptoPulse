version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups:
      actions: {patterns: ["*"]}

  - package-ecosystem: pip
    directory: /
    schedule: {interval: weekly}
    groups:
      dev-tools: {patterns: ["*"]}
  - package-ecosystem: pip
    directory: /app/ingestion
    schedule: {interval: weekly}
  - package-ecosystem: pip
    directory: /app/api
    schedule: {interval: weekly}
  - package-ecosystem: pip
    directory: /app/dashboard
    schedule: {interval: weekly}

  - package-ecosystem: docker
    directory: /app/airflow
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directory: /app/api
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directory: /app/dashboard
    schedule: {interval: weekly}

  - package-ecosystem: terraform
    directory: /infra/envs/dev
    schedule: {interval: weekly}
  - package-ecosystem: terraform
    directory: /infra/envs/prod
    schedule: {interval: weekly}
  - package-ecosystem: terraform
    directory: /infra/bootstrap
    schedule: {interval: weekly}
