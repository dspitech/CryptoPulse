name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5
      - name: Format
        run: terraform fmt -check -recursive infra
      - name: Cablage statique (variables, modules, sorties)
        run: python3 tools/check_terraform_wiring.py
      - name: Validate
        run: |
          for d in infra/bootstrap infra/envs/dev infra/envs/prod; do
            terraform -chdir=$d init -backend=false -input=false
            terraform -chdir=$d validate
          done

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Ingestion
        run: cd app/ingestion && python -m pytest -q
      - name: API
        run: cd app/api && python -m pytest -q
      - name: DAGs Airflow
        run: cd app/airflow && python -m pytest -q
      - name: Dashboards Grafana et cablage Terraform
        run: python -m pytest -q tools

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cryptopulse
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: cryptopulse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cryptopulse" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Clients PostgreSQL 16
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -q && sudo apt-get install -y -q postgresql-client-16
      - name: Azurite
        run: docker run -d -p 10000:10000 mcr.microsoft.com/azure-storage/azurite:3.33.0 azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck --loose
      - name: Dependances (dbt dans un environnement separe, comme en production)
        run: |
          pip install -r requirements-dev.txt
          python -m venv /tmp/dbtenv && /tmp/dbtenv/bin/pip install -r requirements-dbt.txt
      - name: Test d'integration
        env:
          CRYPTOPULSE_E2E: "1"
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_USER: cryptopulse
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: cryptopulse
          COINS: bitcoin,ethereum
          AZURE_STORAGE_CONNECTION_STRING: UseDevelopmentStorage=true
          DBT_BIN: /tmp/dbtenv/bin/dbt
        run: cd app/ingestion && python -m pytest -m e2e tests/e2e -v

  deployment-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scripts shell
        run: shellcheck -S warning app/deploy/deploy.sh app/deploy/bin/*.sh infra/modules/compute/scripts/*.sh tools/*.sh
      - name: Docker Compose (production, local, profils)
        run: |
          sh tools/local_env.sh
          docker compose -f app/deploy/docker-compose.yml --env-file app/deploy/.env.local config -q
          COMPOSE_PROFILES=https,logging docker compose -f app/deploy/docker-compose.yml --env-file app/deploy/.env.local config -q
          docker compose -f app/deploy/docker-compose.yml -f app/deploy/docker-compose.local.yml --env-file app/deploy/.env.local config -q
      - name: Prometheus (configuration et regles d'alerte)
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/app/monitoring/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v2.54.1 check config /etc/prometheus/prometheus.yml
      - name: StatsD, Blackbox, Loki, Promtail
        run: |
          docker run --rm -v "$PWD/app/monitoring/statsd:/cfg:ro" prom/statsd-exporter:v0.26.1 \
            --statsd.mapping-config=/cfg/statsd-mapping.yml --check-config
          docker run --rm -v "$PWD/app/monitoring/blackbox:/cfg:ro" prom/blackbox-exporter:v0.25.0 \
            --config.file=/cfg/blackbox.yml --config.check
          docker run --rm -v "$PWD/app/monitoring/loki:/cfg:ro" grafana/loki:3.1.1 \
            -config.file=/cfg/loki-config.yml -verify-config
          docker run --rm -v "$PWD/app/monitoring/promtail:/cfg:ro" grafana/promtail:3.1.1 \
            -config.file=/cfg/promtail-config.yml -check-syntax
      - name: Caddyfile
        run: |
          docker run --rm -e PUBLIC_FQDN=cryptopulse.example.com -e ACME_EMAIL=ci@example.com \
            -v "$PWD/app/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.8-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secrets dans le code et l'historique
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Mauvaises configurations Terraform (rapport)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: config
          scan-ref: infra
          severity: HIGH,CRITICAL
          exit-code: "0"
      - name: checkov (rapport)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra
          framework: terraform
          soft_fail: true

  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [airflow, api, dashboard]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t cryptopulse-${{ matrix.image }}:ci app/${{ matrix.image }}
      - name: Scan des vulnerabilites (echec sur CRITICAL corrigeable)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: cryptopulse-${{ matrix.image }}:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
